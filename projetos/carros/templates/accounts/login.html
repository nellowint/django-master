{% extends 'base.html' %}
{% block content %}
    <form method="post">
        {% csrf_token %}
        <div class="card p-4">
            <h4>Login</h4>
            <div class="form-floating mt-3 mb-3">
                <input type="text" class="form-control" id="username" placeholder="Informe o usuário" name="username">
                <label for="username">Usuário</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Informe a senha" name="password">
                <label for="password">Senha</label>
            </div>

            <div class="mb-3 mt-3">
                <input type="submit" class="btn btn-primary" value="Entrar">
            </div>
            {% if form.non_field_errors %}
                <div class="alert alert-danger alert-dismissible mb-3" role="alert">
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    <strong>Erro!</strong>
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="row">
                <div class="col">
                    <label>Não possui conta?</label>
                    <a href="{% url 'accounts:register_view' %}">Criar Conta</a>
                </div>
            </div>
        </div>
    </form>
{% endblock %}
