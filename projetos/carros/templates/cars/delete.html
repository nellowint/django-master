{% extends 'base.html' %}
{% block content %}
    <div class="card p-4">
        <div class="d-flex justify-content-center">
            <div>
                <div class="d-flex justify-content-center">
                    <h4>Excluir Carro</h4>
                </div>
                <div class="d-flex justify-content-center">
                    Deseja realmente deletar o registro?
                    <br>
                    Esta opção não pode ser desfeita
                </div>
                <div class="mt-3 d-flex justify-content-center">
                    <form method="post">
                        {% csrf_token %}
                        <a href="{% url 'cars:detail_car' pk=object.pk %}" class="btn btn-secondary">Cancelar<a/>
                        <button type="submit" class="btn btn-danger">Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
