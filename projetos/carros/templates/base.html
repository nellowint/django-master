{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}Carros{% endblock %}</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
            
        <link href="{% static 'css/base.css' %}" rel="stylesheet" >
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
                <div class="container">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="navbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbar">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                    <a class="nav-link" href="{% url 'cars:list_car' %}">Início</a>
                                </li>
                            {% if user.is_authenticated %}
                                <li class="nav-item">
                                    <a class="nav-link" href="{% url 'cars:new_car' %}">Cadastrar</a>
                                </li>
                            {% endif %}
                        </ul>
                        <form class="d-flex" method="get" action="{% url 'cars:list_car' %}">
                            <input class="form-control me-2" type="search" name="search" placeholder="Pesquisar carros...">
                        </form>
                        
                        <div class="ml-2 navbar-brand">
                            {% if user.is_authenticated %}
                                <div class="dropdown">
                                    <div data-bs-toggle="dropdown">
                                        <img src="{% static 'img/avatar.png' %}" alt="User" style="width:40px;" class="rounded-pill"> 
                                        <ul class="dropdown-menu">
                                            <li><a class="dropdown-item" href="#">Olá, {{ user.username }}</a></li>
                                            <li><hr class="dropdown-divider"></hr></li>
                                            <li><a class="dropdown-item" href="{% url 'accounts:logout_view' %}">Logout</a></li>
                                        </ul>
                                    </div>
                                </div>
                            {% else %}
                                <a href="{% url 'accounts:login_view' %}">
                                    <button class="btn btn-primary">Login</button>
                                </a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <div class="container mt-3">
            <main>
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </body>
</html>
