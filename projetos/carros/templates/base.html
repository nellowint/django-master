{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}Carros{% endblock %}</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link href="{% static 'css/base.css' %}" rel="stylesheet" >
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
                <div class="container">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="navbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbar">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                    <a class="nav-link" href="{% url 'cars:list_car' %}">Início</a>
                                </li>
                            {% if user.is_authenticated %}
                                <li class="nav-item">
                                    <a class="nav-link" href="{% url 'cars:new_car' %}">Cadastrar</a>
                                </li>
                            {% endif %}
                        </ul>
                        <form class="d-flex" method="get" action="{% url 'cars:list_car' %}">
                            <input class="form-control me-2" type="search" name="search" placeholder="Pesquisar carros...">
                        </form>
                        
                        <div class="ml-2 navbar-brand">
                            {% if user.is_authenticated %}
                                <div class="dropdown">
                                    <button class="btn p-0 border-0 bg-transparent" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <img src="{% static 'img/avatar.png' %}" alt="User" class="rounded-pill avatar-img">
                                    </button>

                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li><span class="dropdown-item-text">Olá, {{ user.username }}</span></li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li><a class="dropdown-item" href="{% url 'accounts:logout_view' %}">Logout</a></li>
                                    </ul>
                                </div>
                            {% else %}
                                <a href="{% url 'accounts:login_view' %}" class="btn btn-primary">Login</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <div class="container mt-3">
            <main>
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </body>
</html>
